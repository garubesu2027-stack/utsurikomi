<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex">
<title>カニのごはんキャッチ</title>
<style>
  :root { --sea1: #7fd3f0; --sea2: #2c8fc4; --sand: #f2d79b; --ink: #17324a; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #0d4f73; overscroll-behavior: none; }
  body { display: flex; justify-content: center; align-items: center; font-family: "Hiragino Sans", system-ui, sans-serif; color: var(--ink); touch-action: none; user-select: none; -webkit-user-select: none; }
  #wrap { position: relative; width: 100%; max-width: 480px; height: 100%; max-height: 860px; }
  canvas { display: block; width: 100%; height: 100%; }
  .panel { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 14px; text-align: center; padding: 24px; background: rgba(13, 79, 115, .55); color: #fff; }
  .panel[hidden] { display: none; }
  .panel h1 { margin: 0; font-size: 34px; line-height: 1.2; text-shadow: 0 3px 0 #0b3a55; }
  .panel .big { font-size: 72px; line-height: 1; }
  .panel p { margin: 0; font-size: 16px; line-height: 1.7; font-weight: 700; }
  .panel .score { font-size: 44px; font-weight: 900; }
  .btn { font: inherit; font-size: 22px; font-weight: 900; color: #fff; background: linear-gradient(180deg, #ff8a5c, #e2502a); border: 0; border-radius: 999px; padding: 14px 40px; box-shadow: 0 5px 0 #a8341a; cursor: pointer; }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #a8341a; }
  .rule { background: rgba(255,255,255,.15); border-radius: 14px; padding: 10px 16px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>

  <div class="panel" id="start">
    <div class="big">🦀</div>
    <h1>カニの<br>ごはんキャッチ</h1>
    <div class="rule">
      <p>指でなぞってカニを横歩きさせよう</p>
      <p>🐟 +1　🦐 +2　🐙 +5</p>
      <p>🪨 にあたると ❤️ が減るよ</p>
    </div>
    <button class="btn" id="go">スタート</button>
  </div>

  <div class="panel" id="over" hidden>
    <div class="big">🦀💤</div>
    <h1>おしまい！</h1>
    <p class="score" id="final">0点</p>
    <p id="best"></p>
    <button class="btn" id="again">もう一回</button>
  </div>
</div>

<script>
(() => {
  const cv = document.getElementById("c");
  const ctx = cv.getContext("2d");
  let W = 0, H = 0, dpr = 1;

  function resize() {
    const r = cv.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = r.width; H = r.height;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  // ---- ゲームの状態 ----
  const ITEMS = [
    { e: "🐟", pt: 1, w: 50 },
    { e: "🦐", pt: 2, w: 25 },
    { e: "🐙", pt: 5, w: 6 },
    { e: "🪨", pt: -1, w: 30 },   // ハズレ（ライフが減る）
  ];
  let crab, items, pops, bubbles, score, life, t, spawnT, playing, lastTime, targetX;

  function reset() {
    crab = { x: W / 2, w: 64, open: 0, hurt: 0, step: 0 };
    targetX = crab.x;
    items = []; pops = [];
    bubbles = Array.from({ length: 14 }, () => ({ x: Math.random() * W, y: Math.random() * H, r: 2 + Math.random() * 5, v: 12 + Math.random() * 25 }));
    score = 0; life = 3; t = 0; spawnT = 0;
  }

  function pickItem() {
    // 時間がたつほど石が増える
    const rockBonus = Math.min(t / 4, 25);
    const list = ITEMS.map(it => ({ ...it, w: it.pt < 0 ? it.w + rockBonus : it.w }));
    let r = Math.random() * list.reduce((a, b) => a + b.w, 0);
    for (const it of list) { if ((r -= it.w) < 0) return it; }
    return list[0];
  }

  function spawn() {
    const it = pickItem();
    const speed = 150 + Math.min(t * 6, 260) + Math.random() * 60;   // 時間とともに速くなる
    items.push({ ...it, x: 30 + Math.random() * (W - 60), y: -30, v: speed, rot: (Math.random() - .5) * 2, a: 0 });
  }

  // ---- 入力（指でなぞる・キーボード） ----
  function pointerX(e) {
    const r = cv.getBoundingClientRect();
    return (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
  }
  cv.addEventListener("pointerdown", e => { targetX = pointerX(e); });
  cv.addEventListener("pointermove", e => { if (e.buttons || e.pointerType === "touch") targetX = pointerX(e); });
  const keys = {};
  window.addEventListener("keydown", e => { keys[e.key] = true; });
  window.addEventListener("keyup", e => { keys[e.key] = false; });

  // ---- 描画 ----
  function drawBg(dt) {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#9be0f5"); g.addColorStop(.55, "#3aa3d6"); g.addColorStop(1, "#1f7bb0");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // 光のすじ
    ctx.globalAlpha = .12; ctx.fillStyle = "#fff";
    for (let i = 0; i < 4; i++) {
      const x = (i * W / 3 + Math.sin(t * .3 + i) * 30);
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + 40, 0); ctx.lineTo(x + 120, H * .8); ctx.lineTo(x + 60, H * .8); ctx.fill();
    }
    ctx.globalAlpha = 1;
    // 泡
    ctx.strokeStyle = "rgba(255,255,255,.6)"; ctx.lineWidth = 1.5;
    for (const b of bubbles) {
      b.y -= b.v * dt; if (b.y < -10) { b.y = H + 10; b.x = Math.random() * W; }
      ctx.beginPath(); ctx.arc(b.x + Math.sin(t * 2 + b.r) * 4, b.y, b.r, 0, Math.PI * 2); ctx.stroke();
    }
    // 砂浜
    const sandY = H - 70;
    ctx.fillStyle = "#f2d79b";
    ctx.beginPath(); ctx.moveTo(0, sandY);
    for (let x = 0; x <= W; x += 20) ctx.lineTo(x, sandY + Math.sin(x / 40) * 6);
    ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.fill();
    ctx.font = "26px serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("🐚", W * .12, H - 28); ctx.fillText("🌿", W * .88, sandY - 6); ctx.fillText("🪸", W * .7, H - 30);
  }

  function drawCrab() {
    const y = H - 92;
    ctx.save();
    ctx.translate(crab.x, y + Math.abs(Math.sin(crab.step)) * -4);   // 歩くとぴょこぴょこ
    if (crab.hurt > 0 && Math.floor(crab.hurt * 12) % 2 === 0) ctx.globalAlpha = .35;   // 当たったら点滅
    ctx.font = "64px serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("🦀", 0, 0);
    if (crab.open > 0) {   // キャッチしたらハサミがパチッ
      ctx.font = "bold 18px sans-serif"; ctx.fillStyle = "#fff"; ctx.strokeStyle = "#c0392b"; ctx.lineWidth = 4;
      ctx.strokeText("パチッ", 0, -46); ctx.fillText("パチッ", 0, -46);
    }
    ctx.restore();
  }

  function drawHud() {
    ctx.textAlign = "left"; ctx.textBaseline = "top";
    ctx.font = "bold 26px sans-serif"; ctx.lineWidth = 5; ctx.strokeStyle = "#0b3a55"; ctx.fillStyle = "#fff";
    ctx.strokeText(score + "点", 14, 14); ctx.fillText(score + "点", 14, 14);
    ctx.textAlign = "right"; ctx.font = "22px serif";
    ctx.fillText("❤️".repeat(life) + "🤍".repeat(Math.max(0, 3 - life)), W - 12, 16);
  }

  // ---- メインループ ----
  function loop(now) {
    const dt = Math.min((now - lastTime) / 1000, .05); lastTime = now;
    t += dt;
    drawBg(dt);

    if (playing) {
      // カニの移動（横歩きだけ）
      if (keys.ArrowLeft) targetX -= 420 * dt;
      if (keys.ArrowRight) targetX += 420 * dt;
      targetX = Math.max(32, Math.min(W - 32, targetX));
      const dx = targetX - crab.x;
      crab.x += Math.sign(dx) * Math.min(Math.abs(dx), 520 * dt);
      if (Math.abs(dx) > 2) crab.step += dt * 14;
      crab.open = Math.max(0, crab.open - dt); crab.hurt = Math.max(0, crab.hurt - dt);

      // 落とす
      spawnT -= dt;
      if (spawnT <= 0) { spawn(); spawnT = Math.max(.32, .9 - t * .012) * (.7 + Math.random() * .6); }

      const cy = H - 92;
      for (const it of items) {
        it.y += it.v * dt; it.a += it.rot * dt;
        if (!it.done && Math.abs(it.y - cy) < 34 && Math.abs(it.x - crab.x) < 44) {
          it.done = true;
          if (it.pt > 0) {
            score += it.pt; crab.open = .35;
            pops.push({ x: it.x, y: it.y, s: "+" + it.pt, c: "#fff", life: .8 });
          } else {
            life--; crab.hurt = 1;
            pops.push({ x: it.x, y: it.y, s: "いたっ", c: "#ffd1d1", life: .8 });
            if (navigator.vibrate) navigator.vibrate(120);
            if (life <= 0) end();
          }
        }
      }
      items = items.filter(it => !it.done && it.y < H + 40);
    }

    for (const it of items) {
      ctx.save(); ctx.translate(it.x, it.y); ctx.rotate(it.a);
      ctx.font = "40px serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(it.e, 0, 0);
      ctx.restore();
    }
    drawCrab();
    for (const p of pops) {
      p.life -= dt; p.y -= 50 * dt;
      ctx.globalAlpha = Math.max(0, p.life / .8);
      ctx.font = "bold 24px sans-serif"; ctx.textAlign = "center"; ctx.lineWidth = 5; ctx.strokeStyle = "#0b3a55"; ctx.fillStyle = p.c;
      ctx.strokeText(p.s, p.x, p.y); ctx.fillText(p.s, p.x, p.y);
    }
    ctx.globalAlpha = 1;
    pops = pops.filter(p => p.life > 0);
    if (playing) drawHud();
    requestAnimationFrame(loop);
  }

  // ---- 開始・終了 ----
  const start = document.getElementById("start"), over = document.getElementById("over");
  function begin() {
    resize(); reset();
    start.hidden = true; over.hidden = true; playing = true;
  }
  function end() {
    playing = false;
    let best = 0;
    try { best = +(localStorage.getItem("kani-best") || 0); if (score > best) { best = score; localStorage.setItem("kani-best", best); } } catch (e) { best = Math.max(best, score); }
    document.getElementById("final").textContent = score + "点";
    document.getElementById("best").textContent = score >= best && score > 0 ? "🎉 自己ベスト！" : "自己ベスト：" + best + "点";
    setTimeout(() => { over.hidden = false; }, 500);
  }
  document.getElementById("go").addEventListener("click", begin);
  document.getElementById("again").addEventListener("click", begin);

  reset();
  lastTime = performance.now();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
