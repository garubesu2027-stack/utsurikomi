// ===== 調整用の数字（試作なのでここだけ触れば手触りが変わる） =====
const TUNE = {
  bpm: [104, 116, 128, 140],  // 1番＝原曲のテンポ。2番・3番・4番と速くなる（5番目以降は最後の値）
  px16: 60,             // 16分音符1つぶんのカメの間隔（px）。カメの間隔＝音の長さ
  // 判定の幅（ミリ秒）。[1番, 4番以降] で番ごとに厳しくなる
  perfect: [45, 30],
  early:   [100, 60],   // 早押し側の成功幅
  late:    [120, 75],   // 遅押し側の成功幅（人は遅れがちなので少し甘く）
  // ただし短い音が続くところは、隣の着地とかぶらないよう間隔の半分までに縮める
  harmonyAt: 10,        // PERFECTがこの回数続くと、カメ（ずんだもん）がハモる
  click: true,          // 拍ごとのカチッ（テンポの目安）
  rabbit: 'B',          // ウサギの絵：'B'＝本家そのまま（動きなし）／'C'＝ジャンプの動きつき
  showMs: true,         // 判定のズレ（ms）を表示する
};

const W = 800, H = 450;
const RABBIT_X = 200, WATER_Y = 330, SHELL_TOP = WATER_Y - 16;
const cv = document.getElementById('cv'), cx = cv.getContext('2d');
const DPR = Math.min(window.devicePixelRatio || 1, 2);

function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = (W * s) + 'px'; cv.style.height = (H * s) + 'px';
  cv.style.marginTop = Math.max(0, (innerHeight - H * s) / 2) + 'px';
  cv.width = W * DPR; cv.height = H * DPR;
  cx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener('resize', fit); fit();

// ===== 自己ベスト（保存できない環境でも動くように） =====
function loadBest() { try { return +localStorage.getItem('kamepyon-best') || 0; } catch (e) { return 0; } }
function saveBest(v) { try { localStorage.setItem('kamepyon-best', v); } catch (e) {} }

// 1〜4番を1列に並べたもの。s番目に歌う音＝FLAT[s % CN]
const FLAT = [];
SONG.verses.forEach((v, vi) => v.notes.forEach((n, i) => FLAT.push({ v: vi, i, d: n[0], m: n[1], z: n[2], len: n[3], bar: n[4] })));
const CN = FLAT.length, NV = SONG.verses.length;
const noteAt = s => FLAT[s % CN];
const verseNo = s => Math.floor(s / CN) * NV + noteAt(s).v;   // 通算で何番目の番か（0＝1番）

// ===== 音（WebAudio。声の準備はページを開いた時点で始め、最初のタップで鳴らせる状態にする） =====
let ac = null;
const voice = {}, last = { m: null, z: null };
// iPhoneのマナーモードでも音が出るように
try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
function audioUnlock() {
  if (!ac) {
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
    for (const [k, b64] of Object.entries(SONG.clips)) {
      const bin = atob(b64), buf = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
      ac.decodeAudioData(buf.buffer, d => {
        // mp3は頭に無音が入るので、声が始まる所から鳴らす
        const ch = d.getChannelData(0); let i = 0;
        while (i < ch.length && Math.abs(ch[i]) < 0.02) i++;
        voice[k] = { buf: d, off: Math.max(0, i / d.sampleRate - 0.005) };
      });
    }
  }
  if (ac.state === 'suspended') ac.resume().catch(() => {});
}
// performance.now() の時刻 → AudioContext の時刻
function acTime(t) { return ac.currentTime + Math.max(0, t - now()) / 1000; }
// 声を時刻tに鳴らす。前の声は短くフェードして切る（短い音が続くと重なるため）
function play(slot, key, t, vol) {
  const v = ac && voice[key];
  if (!v) return;
  const at = acTime(t);
  if (last[slot]) last[slot].g.gain.setTargetAtTime(0, at, 0.015);
  const s = ac.createBufferSource(), g = ac.createGain();
  g.gain.value = vol; s.buffer = v.buf; s.connect(g); g.connect(ac.destination); s.start(at, v.off);
  last[slot] = { s, g };
}
function click(t, strong) {
  if (!ac || !TUNE.click) return;
  const at = acTime(t), o = ac.createOscillator(), g = ac.createGain();
  o.type = 'square'; o.frequency.value = strong ? 1500 : 1000;
  g.gain.setValueAtTime(strong ? 0.14 : 0.09, at); g.gain.exponentialRampToValueAtTime(0.0001, at + 0.03);
  o.connect(g); g.connect(ac.destination); o.start(at); o.stop(at + 0.04);
}
function failSound() {
  if (!ac) return;
  for (const k of ['m', 'z']) if (last[k]) last[k].g.gain.setTargetAtTime(0, ac.currentTime, 0.02);
  const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(500, t);
  o.frequency.exponentialRampToValueAtTime(80, t + 0.5);
  g.gain.setValueAtTime(0.3, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + 0.5);
}

// ===== 譜面（カメk の着地時刻 L[k] と位置 X[k]） =====
// カメ0＝スタート地点。カメk(k>=1)に着地した瞬間に k-1 番目の音を歌う。
// 位置は16分音符の数に比例（テンポが上がるとスクロールが速くなる）
const now = () => performance.now();
const lerp = (a, b, t) => a + (b - a) * t;
const clamp01 = v => Math.max(0, Math.min(1, v));
function bpmOf(vn) { return TUNE.bpm[Math.min(vn, TUNE.bpm.length - 1)]; }
function ms16(vn) { return 60000 / bpmOf(vn) / 4; }
function buildChart(t0) {
  // 「3・2・1」の3拍ののち、4拍目にカメ0から跳んで、次の小節の頭で最初の音
  const beat0 = ms16(0) * 4;
  st.countStart = t0;
  st.L = [t0 + beat0 * 3, t0 + beat0 * 4];
  st.X = [0, 4 * TUNE.px16];
}
// 足りない分の譜面を先へ伸ばす
function extendChart(k) {
  while (st.L.length <= k + 1) {
    const i = st.L.length - 1, step = i - 1, len = noteAt(step).len;
    st.L.push(st.L[i] + len * ms16(verseNo(step)));
    st.X.push(st.X[i] + len * TUNE.px16);
  }
}
// 16分音符で数えた位置 q（カメ0＝0）の時刻。拍のカチッに使う
function timeAtPos(q) {
  if (q <= 0) return st.L[0] + q * ms16(0);
  let k = 1;
  extendChart(k);
  while (st.X[k] / TUNE.px16 < q) { k++; extendChart(k); }
  const a = st.X[k - 1] / TUNE.px16, b = st.X[k] / TUNE.px16;
  return lerp(st.L[k - 1], st.L[k], (q - a) / (b - a));
}
function verseOfTarget(k) { return verseNo(Math.max(0, k - 1)); }
function win(name, k) {
  const v = lerp(TUNE[name][0], TUNE[name][1], Math.min(1, verseOfTarget(k) / 3));
  if (name === 'early') return Math.min(v, (st.L[k] - st.L[k - 1]) / 2);
  if (name === 'late') { extendChart(k); return Math.min(v, (st.L[k + 1] - st.L[k]) / 2); }
  return v;
}

// ===== ゲームの状態 =====
// state: title / count（3・2・1） / play / fall / over
let st;
function reset(toTitle) {
  st = {
    state: toTitle ? 'title' : 'count',
    score: 0, combo: 0, maxCombo: 0, perfects: 0,
    best: loadBest(), newRecord: false,
    target: 1,           // 次に押すべき着地（カメの番号）
    L: [], X: [], clickPos: -12,
    popup: null, banner: null, fallFrom: null, overAt: 0,
  };
  if (!toTitle) buildChart(now() + 300);
}

function popup(text, color, ms) { st.popup = { text, color, ms, at: now() }; }

function press() {
  audioUnlock();
  const t = now();
  if (st.state === 'title') { reset(false); return; }
  if (st.state === 'over') { if (t - st.overAt > 450) reset(false); return; }
  if (st.state !== 'play') return;   // カウント中は押しても何も起きない

  const k = st.target;
  extendChart(k);
  const d = t - st.L[k]; // マイナス＝早い、プラス＝遅い
  if (d < -win('early', k)) { fail('早すぎ！', d); return; }
  if (d > win('late', k)) { fail('遅すぎ！', d); return; }

  const perfect = Math.abs(d) <= win('perfect', k);
  st.score++; st.target++;
  st.combo = perfect ? st.combo + 1 : 0;
  st.maxCombo = Math.max(st.maxCombo, st.combo);
  if (perfect) st.perfects++;
  // 声は着地の瞬間に（早押しでも）。PERFECTが続いていればカメもハモる
  const n = noteAt(k - 1), at = Math.max(t, st.L[k]);
  play('m', n.m, at, 1);
  if (st.combo >= TUNE.harmonyAt) play('z', n.z, at, 0.75);
  popup(perfect ? (st.combo >= 3 ? `PERFECT ×${st.combo}` : 'PERFECT') : 'GOOD',
        perfect ? '#ffd23f' : '#9fe870', d);
  // 番の最後まで歌えた
  if (n.i === SONG.verses[n.v].notes.length - 1) {
    const vn = verseNo(k - 1);
    st.banner = { text: vn === NV - 1 ? '4番まで歌い切った！🎉' : `${vn + 1}番クリア！`, at: t };
  }
}

function fail(text, d) {
  st.fallFrom = { y: rabbitY(), x: rabbitWorld(), sp: songPos(), t: now() };
  st.state = 'fall';
  popup(text, '#ff6b6b', d);
  failSound();
}

function update() {
  const t = now();
  if (st.state === 'count' && t >= st.L[0]) st.state = 'play';
  if (st.state === 'count' || st.state === 'play') {
    // 拍のカチッを少し先まで予約（カウントの3拍＋本編）。小節の頭は高い音
    for (let at = timeAtPos(st.clickPos); at < t + 120; at = timeAtPos(st.clickPos)) {
      if (at >= t - 20) click(at, ((st.clickPos + 12) % 16 + 16) % 16 === 0);
      st.clickPos += 4;
    }
  }
  if (st.state === 'play') {
    extendChart(st.target);
    if (t > st.L[st.target] + win('late', st.target)) fail('遅すぎ！', null);
  }
  if (st.state === 'fall' && t - st.fallFrom.t > 700) {
    st.state = 'over'; st.overAt = t;
    if (st.score > st.best) { st.best = st.score; st.newRecord = true; saveBest(st.score); }
  }
}

// ===== 位置の計算 =====
// 時刻tにウサギがどの区間を跳んでいるか（k＝向かっているカメ、p＝進み具合）
function seg(t) {
  if (!st.L.length || t < st.L[0]) return { k: 0, p: 1 };
  let k = 1;
  extendChart(k);
  while (t >= st.L[k]) { k++; extendChart(k); }
  return { k, p: (t - st.L[k - 1]) / (st.L[k] - st.L[k - 1]) };
}
// 歌のどこまで進んだか（音の数・小数つき）。景色の切り替えに使う
function songPos() {
  if (st.state === 'title') return 0;
  if (st.state === 'fall' || st.state === 'over') return st.fallFrom.sp;
  const { k, p } = seg(now());
  return k === 0 ? 0 : (k - 2) + p;
}
function rabbitWorld() {
  if (st.state === 'fall' || st.state === 'over') return st.fallFrom.x;
  const { k, p } = seg(now());
  return k === 0 ? 0 : lerp(st.X[k - 1], st.X[k], p);
}
function rabbitY() {
  const { k, p } = seg(now());
  if (k === 0) return SHELL_TOP;
  const h = Math.min(150, 20 + (st.X[k] - st.X[k - 1]) * 0.35);   // 近いカメへは低く、遠いカメへは高く
  return SHELL_TOP - h * 4 * p * (1 - p);
}

// ===== 景色（1番＝昼／2番＝夕方／3番＝夜／4番＝朝焼け）。番が変わると少しずつ移り変わる =====
const SCENES = [
  { sky: ['#8fd3ff', '#d9f1ff'], hill: '#9bd59a', water: '#3a8fc9', night: 0 },
  { sky: ['#ff9a5c', '#ffd9a8'], hill: '#8fae6a', water: '#3b6e9e', night: 0 },
  { sky: ['#0f1b3d', '#2c4277'], hill: '#2f5a45', water: '#1d3557', night: 1 },
  { sky: ['#f39cbc', '#ffe6b8'], hill: '#9cc98f', water: '#4a8fc2', night: 0 },
];
function hex(c) { return [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16)); }
function mixColor(a, b, t) { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], t))).join(',')})`; }
function scene() {
  const sp = Math.max(0, songPos()), s = Math.floor(sp);
  const vn = verseNo(s), vs = s - noteAt(s).i;             // 今の番と、その番が始まった音
  const cur = SCENES[vn % 4], prev = SCENES[(vn + 3) % 4];
  const t = vn === 0 ? 1 : clamp01((sp - vs + 2) / 6);    // 番の変わり目の前後で移り変わる
  return {
    sky0: mixColor(prev.sky[0], cur.sky[0], t), sky1: mixColor(prev.sky[1], cur.sky[1], t),
    hill: mixColor(prev.hill, cur.hill, t), water: mixColor(prev.water, cur.water, t),
    night: lerp(prev.night, cur.night, t),
  };
}

// ===== 描画 =====
const STARS = Array.from({ length: 40 }, (_, i) => [(i * 197) % W, (i * 89) % 220 + 10, (i % 3) + 1]);
function drawBg(t, cam) {
  const sc = scene();
  const g = cx.createLinearGradient(0, 0, 0, WATER_Y);
  g.addColorStop(0, sc.sky0); g.addColorStop(1, sc.sky1);
  cx.fillStyle = g; cx.fillRect(0, 0, W, WATER_Y);
  if (sc.night > 0.01) {   // 夜は星と月
    cx.globalAlpha = sc.night;
    cx.fillStyle = '#fff';
    for (const [x, y, r] of STARS) { cx.globalAlpha = sc.night * (0.5 + 0.5 * Math.sin(t / 400 + x)); cx.fillRect(x, y, r, r); }
    cx.globalAlpha = sc.night;
    cx.fillStyle = '#fff6c8'; cx.beginPath(); cx.arc(640, 80, 28, 0, Math.PI * 2); cx.fill();
    cx.fillStyle = sc.sky0; cx.beginPath(); cx.arc(652, 72, 24, 0, Math.PI * 2); cx.fill();
    cx.globalAlpha = 1;
  }
  const off = cam * 0.2;
  cx.fillStyle = sc.hill;
  for (let k = -1; k < 6; k++) {
    const x = k * 220 - (((off % 220) + 220) % 220);
    cx.beginPath(); cx.ellipse(x, WATER_Y, 160, 70, 0, Math.PI, 0); cx.fill();
  }
  cx.fillStyle = sc.water; cx.fillRect(0, WATER_Y, W, H - WATER_Y);
  cx.strokeStyle = 'rgba(255,255,255,.35)'; cx.lineWidth = 2;
  const woff = (((st.state === 'title' ? t / 20 : cam) % 60) + 60) % 60;
  for (let row = 0; row < 3; row++) {
    cx.beginPath();
    for (let x = -60; x < W + 60; x += 60) {
      const y = WATER_Y + 25 + row * 35, xx = x - woff + row * 20;
      cx.moveTo(xx, y); cx.quadraticCurveTo(xx + 15, y - 6, xx + 30, y);
    }
    cx.stroke();
  }
}

function drawTurtle(x, label, done) {
  cx.fillStyle = '#7cc46a';
  cx.beginPath(); cx.ellipse(x + 30, WATER_Y - 3, 8, 6, 0, 0, Math.PI * 2); cx.fill(); // 頭
  cx.fillStyle = '#3f8f3a';
  cx.beginPath(); cx.ellipse(x, WATER_Y - 1, 27, 16, 0, Math.PI, 0); cx.fill();         // 甲羅
  cx.strokeStyle = '#2d6b2a'; cx.lineWidth = 2;
  cx.beginPath(); cx.moveTo(x - 11, WATER_Y - 1); cx.lineTo(x - 5, SHELL_TOP + 3);
  cx.moveTo(x + 11, WATER_Y - 1); cx.lineTo(x + 5, SHELL_TOP + 3); cx.stroke();
  cx.fillStyle = '#111'; cx.beginPath(); cx.arc(x + 33, WATER_Y - 5, 1.5, 0, Math.PI * 2); cx.fill();
  // 甲羅に歌詞を1文字（歌い終わったカメは薄く）
  if (label) {
    cx.globalAlpha = done ? 0.4 : 1;
    text(label, x, WATER_Y - 7, label.length > 1 ? 14 : 17, '#fff', '#1f5a1c');
    cx.globalAlpha = 1;
  }
}

// 着地の目印：次に押すカメの甲羅の上で縮んでいく輪っか。黄色い輪と重なった瞬間が押しどき
function drawCue(x, k, t) {
  const left = st.L[k] - t;
  if (left > 900) return;
  const r = 18 + Math.max(0, left) * 0.09;
  cx.strokeStyle = 'rgba(255,255,255,.9)'; cx.lineWidth = 3;
  cx.beginPath(); cx.ellipse(x, SHELL_TOP, r, r * 0.35, 0, 0, Math.PI * 2); cx.stroke();
  cx.strokeStyle = 'rgba(255,210,63,.9)';
  cx.beginPath(); cx.ellipse(x, SHELL_TOP, 18, 6, 0, 0, Math.PI * 2); cx.stroke();
}

// ウサギ：本家「ふたりで大冒険」の drawUsagi と同じ形。C のときだけジャンプの動きを足す
// s = { air: 跳んでいるか, p: ジャンプの進み具合0〜1, squash: 着地でつぶれているか, sleepy: 眠そう }
function drawRabbit(x, y, s) {
  const sleepy = s.sleepy;
  if (TUNE.rabbit === 'B') s = {};                     // B は動きなし
  cx.save(); cx.translate(x, y);
  if (s.squash) cx.scale(1.18, 0.82);
  cx.scale(1.25, 1.25);
  if (s.air) cx.rotate((s.p - 0.5) * 0.5);            // 上りは上向き、下りは下向き
  const earRot = s.air ? -0.6 * Math.sin(s.p * Math.PI) : (s.squash ? 0.35 : 0); // 耳が後ろへなびく
  const fdx = s.air ? 4 : 0, fdy = s.air ? 3 : 0;      // 空中では足を伸ばす
  cx.fillStyle = '#ffffff'; cx.strokeStyle = '#d9b8c6'; cx.lineWidth = 1.5;
  cx.beginPath(); cx.arc(-13, -12, 4, 0, Math.PI * 2); cx.fill(); cx.stroke();                     // しっぽ
  cx.beginPath(); cx.ellipse(-4 - fdx, -2 + fdy, 6, 3, 0, 0, Math.PI * 2); cx.fill(); cx.stroke();  // 足
  cx.beginPath(); cx.ellipse(6 + fdx, -2 + fdy, 6, 3, 0, 0, Math.PI * 2); cx.fill(); cx.stroke();
  cx.beginPath(); cx.ellipse(0, -12, 13, 11, 0, 0, Math.PI * 2); cx.fill(); cx.stroke();            // 体
  const ear = (ex, rot) => {
    cx.save(); cx.translate(ex, -33); cx.rotate(rot);
    cx.fillStyle = '#fff'; cx.beginPath(); cx.ellipse(0, -9, 4, 11, 0, 0, Math.PI * 2); cx.fill(); cx.stroke();
    cx.fillStyle = '#f7a8c4'; cx.beginPath(); cx.ellipse(0, -9, 2, 8, 0, 0, Math.PI * 2); cx.fill();
    cx.restore();
  };
  ear(2, -0.15 + earRot); ear(9, 0.25 + earRot);
  cx.fillStyle = '#fff'; cx.beginPath(); cx.arc(7, -25, 9.5, 0, Math.PI * 2); cx.fill(); cx.stroke(); // 頭
  if (sleepy) {                                                                                       // 閉じた目
    cx.strokeStyle = '#d6336c'; cx.lineWidth = 1.5;
    cx.beginPath(); cx.arc(11, -28, 2.2, 0.2, Math.PI - 0.2); cx.stroke();
  } else {
    cx.fillStyle = '#d6336c'; cx.beginPath(); cx.arc(11, -27, 2, 0, Math.PI * 2); cx.fill();           // 目
  }
  cx.fillStyle = '#ffb3c8'; cx.beginPath(); cx.arc(9, -22, 2.4, 0, Math.PI * 2); cx.fill();           // ほっぺ
  cx.restore();
}

function text(s, x, y, size, color, stroke) {
  cx.font = `bold ${size}px "Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif`;
  cx.textAlign = 'center'; cx.textBaseline = 'middle';
  if (stroke) { cx.lineWidth = size / 6; cx.lineJoin = 'round'; cx.strokeStyle = stroke; cx.strokeText(s, x, y); }
  cx.fillStyle = color; cx.fillText(s, x, y);
}

// 水面の下に今歌っている小節の歌詞を出す（歌ったところは白、これからは薄く）
function drawLyric() {
  const ls = Math.max(0, st.score - 1), n = noteAt(ls);
  const line = FLAT.filter(f => f.v === n.v && f.bar === n.bar);
  const done = st.score === 0 ? 0 : n.i - line[0].i + 1;
  const chars = line.map(f => f.d), step = 30;
  const widths = chars.map(c => c.length * step), total = widths.reduce((a, b) => a + b, 0);
  let x = W / 2 - total / 2;
  chars.forEach((c, j) => {
    cx.globalAlpha = j < done ? 1 : 0.35;
    text(c, x + widths[j] / 2, 405, 26, j === done - 1 ? '#ffd23f' : '#fff');
    x += widths[j];
  });
  cx.globalAlpha = 1;
}

function draw() {
  const t = now();
  if (st.state === 'title') {
    drawBg(t, 0);
    for (let i = 0; i < 4; i++) drawTurtle(RABBIT_X + i * 4 * TUNE.px16, '', false);
    drawRabbit(RABBIT_X, SHELL_TOP, {});
    text('カメぴょん！', W / 2, 100, 64, '#fff', '#2a5d86');
    text('（試作版）', W / 2, 150, 22, '#2a5d86');
    if (Math.floor(t / 500) % 2 === 0) text('タップ / スペースでスタート', W / 2, 215, 28, '#fff', '#2a5d86');
    text('歌に合わせてカメに着地！ 4番まで歌い切れるかな？', W / 2, 260, 20, '#2a5d86');
    if (st.best) text(`自己ベスト ${st.best}`, W / 2, 380, 22, '#fff');
    if (innerHeight > innerWidth) text('📱 スマホは横向きにすると大きく遊べるよ', W / 2, 36, 22, '#fff', '#2a5d86');
    text('VOICEVOX:四国めたん／VOICEVOX:ずんだもん　曲：うさぎとかめ（作詞 石原和三郎・作曲 納所弁次郎）', W / 2, 430, 12, 'rgba(255,255,255,.85)');
    text(`v${VERSION}`, W - 40, 410, 11, 'rgba(255,255,255,.7)');
    return;
  }

  const cam = rabbitWorld() - RABBIT_X;
  drawBg(t, cam);

  // 画面に入るカメを描く
  const fallen = st.state === 'fall' || st.state === 'over';
  for (let k = 0; ; k++) {
    extendChart(k);
    const x = st.X[k] - cam;
    if (x > W + 60) break;
    if (x < -60) continue;
    drawTurtle(x, k > 0 ? noteAt(k - 1).d : '', k < st.target);
    if (!fallen && k === st.target) drawCue(x, k, t);
  }

  // ウサギ（3番の「グーグー」の所では眠そう）
  const cur = noteAt(Math.max(0, st.target - 2));
  const sleepy = cur.v === 2 && cur.bar >= 6 && !fallen;
  if (fallen) {
    const k = Math.min(1, (t - st.fallFrom.t) / 600);
    const y = st.fallFrom.y + k * k * 140;
    if (y < WATER_Y + 10) drawRabbit(RABBIT_X, y, { air: true, p: 0.9 });
    if (k > 0.3) { // しぶき
      const s = (k - 0.3) / 0.7;
      cx.fillStyle = `rgba(255,255,255,${1 - s})`;
      for (let j = -3; j <= 3; j++) {
        cx.beginPath(); cx.arc(RABBIT_X + j * 10 * (1 + s), WATER_Y - Math.sin(s * Math.PI) * (30 - Math.abs(j) * 6), 5, 0, Math.PI * 2); cx.fill();
      }
    }
  } else {
    const { k, p } = seg(t);
    const land = k > 0 && (t - st.L[k - 1]) < 70;   // 着地した直後（C のときだけむにっとつぶれる）
    const y = rabbitY();
    drawRabbit(RABBIT_X, y, { air: k > 0 && !land, p, squash: land, sleepy });
    if (sleepy) text('Zzz', RABBIT_X + 34, y - 62 - 4 * Math.sin(t / 200), 18, '#fff', '#2a5d86');
  }

  // カウント（3・2・1）
  if (st.state === 'count') {
    const n = 3 - Math.floor((t - st.countStart) / (ms16(0) * 4));
    if (n >= 1 && n <= 3) text(String(n), W / 2, 200, 90, '#fff', '#2a5d86');
  }

  if (st.state !== 'over') {
    drawLyric();
    text(String(st.score), W / 2, 50, 54, '#fff', '#2a5d86');
    text(`BEST ${st.best}`, W - 70, 30, 18, '#fff', '#2a5d86');
    const vn = verseOfTarget(st.target);
    text(`${(vn % NV) + 1}番 ♩=${bpmOf(vn)}`, 70, 30, 18, '#fff', '#2a5d86');
    if (st.combo >= TUNE.harmonyAt && !fallen) text('🐢 カメもハモり中♪', 100, 62, 16, '#9fe870', '#1d3b52');
  }

  // 番クリアの表示
  if (st.banner && t - st.banner.at < 1500 && !fallen) {
    const a = clamp01((1500 - (t - st.banner.at)) / 400);
    cx.globalAlpha = a;
    text(st.banner.text, W / 2, 245, 40, '#fff', '#c2410c');
    cx.globalAlpha = 1;
  }

  // 判定の表示（ウサギと重ならないよう画面の真ん中に）
  if (st.popup && t - st.popup.at < 600 && st.state !== 'over') {
    const a = 1 - (t - st.popup.at) / 600;
    cx.globalAlpha = Math.max(0, a);
    text(st.popup.text, W / 2, 125 - (1 - a) * 20, 32, st.popup.color, '#1d3b52');
    if (TUNE.showMs && st.popup.ms != null) {
      const ms = Math.round(st.popup.ms);
      text(`${ms > 0 ? '+' : ''}${ms}ms`, W / 2, 158 - (1 - a) * 20, 18, '#fff', '#1d3b52');
    }
    cx.globalAlpha = 1;
  }

  if (st.state === 'over') {
    cx.fillStyle = 'rgba(0,0,0,.45)'; cx.fillRect(0, 0, W, H);
    text('ドボン…', W / 2, 80, 34, '#fff');
    text(String(st.score), W / 2, 160, 96, '#fff', '#2a5d86');
    const reached = st.score === 0 ? 0 : verseNo(st.score - 1);
    text(`匹わたった（${(reached % NV) + 1}番の途中まで）`, W / 2, 225, 22, '#fff');
    if (st.newRecord) {
      const s = 1 + Math.sin(t / 120) * 0.05;
      cx.save(); cx.translate(W / 2, 278); cx.scale(s, s);
      text('NEW RECORD!', 0, 0, 36, '#ffd23f', '#7a4b00'); cx.restore();
    } else {
      text(`自己ベスト ${st.best}`, W / 2, 278, 24, '#fff');
    }
    text(`PERFECT ${st.perfects}回 ／ 最大連続 ${st.maxCombo}`, W / 2, 325, 18, '#ddd');
    if (t - st.overAt > 450) text('タップでもう1回', W / 2, 390, 26, '#fff', '#2a5d86');
  }
}

function loop() { update(); draw(); requestAnimationFrame(loop); }

// ===== 入力（指が触れた瞬間・キーが押された瞬間で受け取る。スマホは画面のどこを触ってもOK） =====
document.addEventListener('pointerdown', e => { e.preventDefault(); press(); });
addEventListener('keydown', e => {
  if (e.repeat) return;
  if ([' ', 'Enter', 'ArrowUp', 'z', 'Z'].includes(e.key)) { e.preventDefault(); press(); }
});
document.addEventListener('dblclick', e => e.preventDefault());

reset(true);
audioUnlock();   // 声の読み込みを先に始める（鳴らすのは最初のタップで resume してから）
loop();
</script>
</body>
</html>
