<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>音の診断</title>
<style>body{font-family:-apple-system,"Hiragino Sans",sans-serif;background:#f4f7fb;margin:0;padding:16px;color:#223}h1{font-size:20px}h2{font-size:16px;margin:22px 0 6px}button,a.b{display:block;width:100%;box-sizing:border-box;font-size:17px;margin:8px 0;padding:14px;border-radius:12px;border:2px solid #3f7bd9;background:#fff;color:#223;text-align:left;text-decoration:none}button:active{background:#dfeaff}#info{font-size:12px;background:#fff;border-radius:8px;padding:8px;word-break:break-all}</style></head><body>
<h1>🔇 消音モードの音の診断</h1>
<p>iPhoneを<b>消音にしたまま</b>、上から順に押して「鳴った／鳴らない」を教えてね。</p>
<h2>A. 鳴らし方ごとのテスト</h2>
<button id="t1">① 音楽と同じ鳴らし方（audio）</button>
<button id="t2">② ゲームの効果音の鳴らし方（WebAudio）</button>
<button id="t3">③ ②＋「音楽扱いにする」設定をしてから鳴らす</button>
<h2>A2. 別の鳴らし方（追加）</h2>
<button id="t4">⑧ 動画（video）として鳴らす</button>
<button id="t5">⑨ 設定を「auto」に戻してから①と同じ鳴らし方</button>
<button id="t6">⑩ 無音をずっと流しておいてから②の鳴らし方</button>
<button id="t7">⑪ mp3ファイルで鳴らす</button>
<h2>B. 昔のゲーム（どれもステージ1が遊べる）</h2>
<a class="b" href="74552d1.html">④ 10/16 昼の版（音は全部 audio）</a>
<a class="b" href="88081d6.html">⑤ 10/16 夜の版（効果音を足した直後）</a>
<a class="b" href="2522c67.html">⑥ 10/16 夜の版（効果音を WebAudio に変えた直後）</a>
<a class="b" href="ba4c39b.html">⑦ 10/17 昼の版（ブログ記事を出したとき）</a>
<h2>C. iPhoneの情報</h2><div id="info"></div>
<script>
const SR=24000;
function beep(f){const n=SR*0.35,d=new Float32Array(n);for(let i=0;i<n;i++)d[i]=Math.sin(2*Math.PI*f*i/SR)*0.5*(1-i/n);return d;}
function wavUrl(d){const n=d.length,ab=new ArrayBuffer(44+n*2),v=new DataView(ab),w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,SR,true);v.setUint32(28,SR*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);for(let i=0;i<n;i++)v.setInt16(44+i*2,d[i]*0x7fff,true);return URL.createObjectURL(new Blob([ab],{type:'audio/wav'}));}
const url=wavUrl(beep(660));
document.getElementById('t1').onclick=()=>{new Audio(url).play().catch(e=>alert('①エラー '+e));};
let ac=null;
function wa(f){ if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)(); ac.resume(); const b=ac.createBuffer(1,SR*0.35,SR); b.getChannelData(0).set(beep(f)); const s=ac.createBufferSource(); s.buffer=b; s.connect(ac.destination); s.start(); }
document.getElementById('t2').onclick=()=>wa(880);
document.getElementById('t3').onclick=()=>{ try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(e){} wa(990); info(); };
document.getElementById('t4').onclick=()=>{const v=document.createElement('video');v.setAttribute('playsinline','');v.src=url;v.style.cssText='width:1px;height:1px';document.body.appendChild(v);v.play().catch(e=>alert('⑧エラー '+e));};
document.getElementById('t5').onclick=()=>{try{if(navigator.audioSession)navigator.audioSession.type='auto';}catch(e){} new Audio(url).play().catch(e=>alert('⑨エラー '+e)); info();};
let keep=null;
document.getElementById('t6').onclick=()=>{ if(!keep){ const n=SR,d=new Float32Array(n); keep=new Audio(wavUrl(d)); keep.loop=true; keep.play().catch(e=>alert('⑩エラー '+e)); } setTimeout(()=>wa(1100),300); };
document.getElementById('t7').onclick=()=>{new Audio('beep.mp3').play().catch(e=>alert('⑪エラー '+e));};
function info(){ document.getElementById('info').textContent='audioSession: '+(navigator.audioSession?('あり（'+navigator.audioSession.type+'）'):'なし')+' / '+navigator.userAgent; }
info();
</script></body></html>
